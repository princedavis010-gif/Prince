<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v63.3 COMPLETE</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        .coin-wrapper { perspective: 1000px; margin: 35px 0; z-index: 5; }
        .coin-btn { width: 320px; height: 320px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.08s ease-out; transform-style: preserve-3d; cursor: pointer; background-image: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg'); background-size: cover; background-position: center; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.4s ease; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 16px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-active-grey { background: #555 !important; color: #888 !important; cursor: default !important; }
        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }
        .tap-val { position: absolute; color: var(--gold); font-size: 35px; font-weight: 900; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 1000; text-shadow: 0 0 10px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }
        #ad-countdown { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 50px; z-index: 10001; font-weight: bold; color: var(--gold); }
        .glass-card { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; width: 100%; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .bal-container { display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 900; color: var(--gold); }
        .bal-coin { width: 45px; height: 45px; margin-right: 10px; border-radius: 50%; background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover; }
    </style>
</head>

<body onload="initApp();">
    <div id="ad-countdown">NEXT AD IN: <span id="ad-timer-val">7</span>s</div>

    <div id="home" class="container active">
        <div class="bal-container">
            <div class="bal-coin"></div>
            <span id="balance">0</span>
        </div>
        <div style="font-size: 20px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        <div id="prem-timer" style="color:var(--green); font-weight:bold; font-size:12px; height:15px; margin-top:5px;"></div>
        
        <div class="coin-wrapper">
            <div class="coin-btn" id="coin" onpointerdown="handleTap(event)"></div>
        </div>
        <div style="color:#777; font-size:12px;">⚡ <span id="energy">1000</span> / 1000</div>
        
        <button class="btn-gold" style="background: var(--dia); color:#000;" onclick="showDoubleAd()">📺 GET FREE 3,000 COINS</button>
        <button class="btn-gold" style="background: #222; border: 1px solid var(--gold); color:var(--gold);" onclick="showMonetag()">📺 GET FREE 3,000 COINS</button>
    </div>

    <div id="shop" class="container">
        <h2 style="color:var(--gold);">BOOSTERS</h2>
        <div class="glass-card">
            <h3>🤖 AUTO-TAP BOT</h3>
            <button id="bot-purchase-btn" class="btn-gold" onclick="buyBot()">ACTIVATE FOR FREE</button>
        </div>
    </div>

    <div id="premium" class="container">
        <h2 style="color:var(--gold);">PREMIUM SHOP</h2>
        <div class="glass-card">
            <p style="color:var(--gold); font-weight:bold; font-size:24px;">ID: <span id="p-suffix">--</span></p>
            <input type="text" id="code-input" class="btn-gold" style="background:#111; color:#fff; text-align:center;" placeholder="ENTER CODE">
            <button id="activate-btn" class="btn-gold" style="background:var(--green);" onclick="activatePremium()">ACTIVATE PREMIUM</button>
        </div>
        <div class="glass-card" style="margin-top:20px;">
            <h4 id="admin-trigger" onclick="handleAdminTap()" style="cursor:pointer;">📜 RECENT ACTIVITY</h4>
            <div id="admin-box" style="display:none; margin-top:15px; border-top:1px solid #444; padding-top:10px;">
                <input type="text" id="adm-suffix" class="btn-gold" style="background:#333; color:#fff; height:35px;" placeholder="Suffix">
                <input type="number" id="adm-salt" class="btn-gold" style="background:#333; color:#fff; height:35px;" placeholder="Salt">
                <button class="btn-gold" onclick="generateAdminCode()">GENERATE CODE</button>
                <p id="gen-result" style="color:var(--green); font-weight:bold;"></p>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🪙<br>Home</div>
        <div class="nav-item" onclick="showTab('shop', this)">⚡<br>Boost</div>
        <div class="nav-item" onclick="showTab('premium', this)">⭐<br>Elite</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const suffix = uid.slice(-4);
        const v = "v3_";
        const secretKey = 777;
        
        let bal = parseInt(localStorage.getItem(v + 'bal_' + uid)) || 0;
        let dia = parseInt(localStorage.getItem(v + 'dia_' + uid)) || 0;
        let salt = parseInt(localStorage.getItem(v + 'salt_' + uid)) || 1;
        let adThreshold = parseInt(localStorage.getItem(v + 'adT_' + uid)) || 0;
        let premExpiry = parseInt(localStorage.getItem(v + 'premExp_' + uid)) || 0;
        let hasBot = localStorage.getItem(v + 'bot_' + uid) === 'true';
        let botExpiry = parseInt(localStorage.getItem(v + 'botExp_' + uid)) || 0;
        let eng = 1000;

        const AdController = window.Adsgram.init({ blockId: "22672" });

        function initApp() { updateUI(); if (hasBot) startBot(); setInterval(checkPremiumExpiry, 1000); }

        function handleTap(e) {
            e.preventDefault();
            if (eng <= 0) return;
            const t = e.changedTouches ? e.changedTouches[0] : e;
            let val = (premExpiry > Date.now() ? 20 : 1);
            bal += val; adThreshold += val; eng--;
            
            localStorage.setItem(v + 'bal_' + uid, bal);
            localStorage.setItem(v + 'adT_' + uid, adThreshold);

            if (adThreshold >= 5000) { 
                adThreshold = 0; localStorage.setItem(v + 'adT_' + uid, 0);
                AdController.show().then(() => { bal += 500; updateUI(); }); 
            }

            const valEl = document.createElement('div');
            valEl.className = 'tap-val'; valEl.innerText = `+${val}`;
            valEl.style.left = t.clientX + 'px'; valEl.style.top = t.clientY + 'px';
            document.body.appendChild(valEl);
            setTimeout(() => valEl.remove(), 800);
            updateUI();
        }

        function showDoubleAd() {
            AdController.show().then(() => {
                let w = 7; document.getElementById('ad-countdown').style.display = 'block';
                const t = setInterval(() => {
                    w--; document.getElementById('ad-timer-val').innerText = w;
                    if (w <= 0) { clearInterval(t); document.getElementById('ad-countdown').style.display = 'none'; AdController.show().then(() => { bal += 3000; updateUI(); }); }
                }, 1000);
            });
        }

        async function showMonetag() {
            if (typeof show_10611291 === 'function') {
                const res = await show_10611291({ telegram_id: uid });
                if (res && res.reward_event_type === 'valued') { bal += 3000; updateUI(); }
            }
        }

        function buyBot() {
            hasBot = true; botExpiry = Date.now() + (12 * 60 * 60 * 1000);
            localStorage.setItem(v + 'bot_' + uid, true);
            localStorage.setItem(v + 'botExp_' + uid, botExpiry);
            startBot(); updateUI();
        }

        function startBot() { setInterval(() => { if (botExpiry > Date.now()) { bal += (premExpiry > Date.now() ? 5 : 1); updateUI(); } }, 3000); }

        function activatePremium() {
            const p1 = (parseInt(suffix) + secretKey).toString(16);
            const p2 = (parseInt(salt) * 157).toString(16);
            if (document.getElementById('code-input').value.trim() === `DVS-${p1}-${p2}-${suffix}`) {
                premExpiry = Date.now() + (3 * 24 * 60 * 60 * 1000); salt++;
                localStorage.setItem(v + 'premExp_' + uid, premExpiry);
                localStorage.setItem(v + 'salt_' + uid, salt);
                updateUI(); tg.showAlert("Premium Active!");
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = bal.toLocaleString();
            document.getElementById('diamonds').innerText = dia;
            document.getElementById('p-suffix').innerText = suffix;
            document.getElementById('energy').innerText = eng;
            const bBtn = document.getElementById('bot-purchase-btn');
            if (hasBot && botExpiry > Date.now()) { bBtn.innerText = "ACTIVE"; bBtn.className = "btn-gold btn-active-grey"; }
        }

        function checkPremiumExpiry() {
            const t = document.getElementById('prem-timer');
            if(premExpiry > Date.now()) {
                const diff = premExpiry - Date.now();
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                t.innerText = `PREMIUM: ${d}d ${h}h left`;
            } else t.innerText = "";
        }

        let adminTaps = 0;
        function handleAdminTap() { adminTaps++; if (adminTaps === 3) { if (prompt("Pass:") === "DavisAdmin2026") document.getElementById('admin-box').style.display = 'block'; adminTaps = 0; } setTimeout(() => adminTaps = 0, 2000); }
        function generateAdminCode() {
            const sfx = document.getElementById('adm-suffix').value;
            const slt = document.getElementById('adm-salt').value;
            const p1 = (parseInt(sfx) + secretKey).toString(16);
            const p2 = (parseInt(slt) * 157).toString(16);
            document.getElementById('gen-result').innerText = `DVS-${p1}-${p2}-${sfx}`;
        }
        function showTab(id, el) { document.querySelectorAll('.container').forEach(c => c.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    </script>
</body>
</html>
