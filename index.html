<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v63.3</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        
        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .coin-wrapper { perspective: 1000px; margin: 35px 0; z-index: 5; }
        .coin-btn { width: 320px; height: 320px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.08s ease-out; transform-style: preserve-3d; cursor: pointer; background-image: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg'); background-size: cover; background-position: center; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .tap-val { position: absolute; color: var(--gold); font-size: 35px; font-weight: 900; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 1000; text-shadow: 0 0 10px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }

        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 16px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; transition: opacity 0.5s ease, filter 0.5s ease; }
        
        /* THE GRAY STYLE */
        .btn-cooldown { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; }

        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--gold); }

        .bal-container { display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 900; color: var(--gold); }
        .bal-coin { width: 45px; height: 45px; margin-right: 10px; border-radius: 50%; background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover; }
    </style>
</head>

<body onload="initApp();">

    <div id="home" class="container active">
        <div class="bal-container">
            <div id="bal-icon" class="bal-coin"></div>
            <span id="balance">0</span>
        </div>
        <div style="font-size: 20px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        
        <div class="coin-wrapper">
            <div class="coin-btn" id="coin" onpointerdown="handleTap(event)"></div>
        </div>
        <div style="color:#777; font-size:12px;">⚡ <span id="energy">1000</span> / 1000</div>

        <div style="width:100%; margin-top:20px;">
            <button id="monetag-btn" class="btn-gold" onclick="showMonetag()">📺 GET FREE 3,000 COINS</button>
        </div>
    </div>

    <div id="tasks" class="container">
        <h2 style="color:var(--gold);">TASKS</h2>
        <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; width:100%; text-align:center;">
            <p>Invite friends to earn more!</p>
            <button class="btn-gold" onclick="tg.showAlert('Coming Soon!')">INVITE</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🏠 HOME</div>
        <div class="nav-item" onclick="showTab('tasks', this)">📋 TASKS</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const v = "v5_";

        let bal = parseInt(localStorage.getItem(v + 'bal_' + uid)) || 0;
        let dia = parseInt(localStorage.getItem(v + 'dia_' + uid)) || 0;
        let eng = localStorage.getItem(v + 'eng_' + uid) !== null ? parseInt(localStorage.getItem(v + 'eng_' + uid)) : 1000;

        function initApp() {
            updateUI();
            checkCooldownOnStartup();
            setInterval(() => { if(eng < 1000) { eng++; updateUI(); } }, 2000);
        }

        function showTab(tabId, el) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function handleTap(e) {
            e.preventDefault();
            if (eng > 0) {
                bal += 1; eng--;
                const valEl = document.createElement('div');
                valEl.className = 'tap-val'; valEl.innerText = `+1`;
                valEl.style.left = e.clientX + 'px'; valEl.style.top = e.clientY + 'px';
                document.body.appendChild(valEl);
                setTimeout(() => valEl.remove(), 800);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = bal.toLocaleString();
            document.getElementById('diamonds').innerText = dia;
            document.getElementById('energy').innerText = eng;
            localStorage.setItem(v + 'bal_' + uid, bal);
            localStorage.setItem(v + 'eng_' + uid, eng);
        }

        async function showMonetag() {
            const btn = document.getElementById('monetag-btn');
            const now = Date.now();
            const cooldownEnd = localStorage.getItem(v + 'monetag_expiry_' + uid) || 0;

            if (now < cooldownEnd) {
                const remaining = Math.ceil((cooldownEnd - now) / 1000);
                tg.showAlert(`Cooldown; ${remaining} seconds remaining`);
                return;
            }

            if (typeof show_10611291 === 'function') {
                try {
                    const res = await show_10611291({ telegram_id: uid });
                    if (res && res.reward_event_type === 'valued') {
                        bal += 3000;
                        updateUI();
                        tg.showAlert("✅ +3,000 Coins Added!");
                        const expiry = Date.now() + (90 * 1000);
                        localStorage.setItem(v + 'monetag_expiry_' + uid, expiry);
                        runVisualTimer(btn, 90);
                    } else {
                        tg.showAlert("Ad skipped or not valued. No reward.");
                    }
                } catch (e) { tg.showAlert("Ad failed to load."); }
            }
        }

        function checkCooldownOnStartup() {
            const btn = document.getElementById('monetag-btn');
            const cooldownEnd = localStorage.getItem(v + 'monetag_expiry_' + uid) || 0;
            const now = Date.now();
            if (now < cooldownEnd) {
                const remaining = Math.ceil((cooldownEnd - now) / 1000);
                runVisualTimer(btn, remaining);
            }
        }

        function runVisualTimer(btn, seconds) {
            btn.classList.add('btn-cooldown');
            const timer = setInterval(() => {
                const now = Date.now();
                const expiry = localStorage.getItem(v + 'monetag_expiry_' + uid);
                let timeLeft = Math.ceil((expiry - now) / 1000);

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.classList.remove('btn-cooldown');
                    btn.innerText = "📺 GET FREE 3,000 COINS";
                } else {
                    btn.innerText = `WAIT (${timeLeft}s)`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
