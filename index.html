<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v63.3 MASTER</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        
        /* 3D Coin Wrapper & Physics */
        .coin-wrapper { perspective: 1000px; margin: 30px 0; z-index: 5; }
        .coin-btn { 
            width: 320px; height: 320px; border-radius: 50%; 
            background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover;
            transition: transform 0.1s ease-out; transform-style: preserve-3d;
            cursor: pointer; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.3s ease; }
        
        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 16px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; }
        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }
        .glass-card { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; width: 100%; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        
        /* Warp Boost Effect */
        body.boost-active { background: radial-gradient(circle, #1a0033 0%, #010205 100%); animation: lightning 1.5s infinite; }
        @keyframes lightning { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

        .tap-val { position: absolute; color: var(--gold); font-size: 35px; font-weight: 900; animation: floatUp 0.8s forwards; pointer-events: none; text-shadow: 0 0 10px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-140px); } }
        #ad-countdown { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 50px; z-index: 10001; color: var(--gold); font-weight: bold; }
    </style>
</head>

<body onload="initApp();">
    <div id="ad-countdown">NEXT AD IN: <span id="ad-timer-val">7</span>s</div>

    <div id="home" class="container active">
        <div style="font-size: 45px; font-weight: 900; color: var(--gold);">🪙 <span id="balance">0</span></div>
        <div style="font-size: 18px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        <div id="prem-timer" style="color:var(--green); font-size:12px; height:15px; margin-top:5px;"></div>
        
        <div class="coin-wrapper">
            <div class="coin-btn" id="coin" onpointerdown="handleTap(event)" onpointerup="resetTilt()" onpointerleave="resetTilt()"></div>
        </div>
        
        <div id="boost-timer" style="color:var(--purple); font-weight:bold; height:20px;"></div>
        <div style="color:#777; font-size:12px;">⚡ <span id="energy">1000</span> / 1000</div>
        
        <button class="btn-gold" style="background: var(--dia); color:#000;" onclick="showDoubleAd()">📺 GET FREE 3,000 COINS</button>
        <button class="btn-gold" style="background: #222; border: 1px solid var(--gold); color:var(--gold);" onclick="showMonetag()">📺 GET FREE 3,000 COINS</button>
    </div>

    <div id="tasks" class="container">
        <h2 style="color:var(--gold);">TASKS</h2>
        <div class="glass-card" style="border: 1px solid var(--purple);">
            <h3>👥 INVITE FRIENDS</h3>
            <button class="btn-gold" style="background:var(--purple); color:white;" onclick="shareInvite()">INVITE (+10,000)</button>
        </div>
        <div class="glass-card">
            <p>TikTok @ogprincedavis5081</p>
            <button class="btn-gold" style="background:#ff0050; color:white;" onclick="doTask(5000)">LIKE/COMMENT (+5,000)</button>
        </div>
    </div>

    <div id="shop" class="container">
        <h2 style="color:var(--gold);">BOOSTERS</h2>
        <div class="glass-card">
            <h3>🤖 AUTO-TAP BOT</h3>
            <button id="bot-purchase-btn" class="btn-gold" onclick="buyBot()">ACTIVATE FOR FREE</button>
        </div>
        <div class="glass-card">
            <h3>⚡ WARP BOOST (5X)</h3>
            <p>Daily Uses Left: <span id="boost-count">2</span>/2</p>
            <button id="boost-btn" class="btn-gold" style="background:var(--purple); color:white;" onclick="activateBoost()">ACTIVATE WARP</button>
        </div>
    </div>

    <div id="premium" class="container">
        <h2 style="color:var(--gold);">ELITE PANEL</h2>
        <div class="glass-card">
            <p style="font-size:22px; font-weight:bold;">USER ID: <span id="dm-id">--</span></p>
            <p>OPay Account: <b style="color:var(--green);">8124647818</b></p>
            <button class="btn-gold" onclick="contactAdmin()">DIRECT MESSAGE ADMIN</button>
            <input type="text" id="code-input" class="btn-gold" style="background:#111; color:#fff; text-align:center; margin-top:15px;" placeholder="ENTER ACTIVATION CODE">
            <button class="btn-gold" style="background:var(--green);" onclick="activatePremium()">ACTIVATE PREMIUM</button>
        </div>
        
        <div class="glass-card">
            <h4 onclick="handleAdminTap()">📜 RECENT ACTIVITY</h4>
            <div id="tx-history" style="font-size:11px; color:#888; text-align:left;"></div>
            
            <div id="admin-box" style="display:none; margin-top:15px; border-top:1px solid #444; padding-top:10px;">
                <input type="text" id="adm-suffix" placeholder="Suffix" style="width:45%; padding:8px;">
                <input type="number" id="adm-salt" placeholder="Salt" style="width:45%; padding:8px;">
                <button class="btn-gold" onclick="generateAdminCode()">GENERATE CODE</button>
                <p id="gen-result" style="color:var(--green); font-weight:bold;"></p>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🪙<br>Home</div>
        <div class="nav-item" onclick="showTab('tasks', this)">📋<br>Tasks</div>
        <div class="nav-item" onclick="showTab('shop', this)">⚡<br>Boost</div>
        <div class="nav-item" onclick="showTab('premium', this)">⭐<br>Elite</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const suffix = uid.slice(-4);
        const v = "v3_";

        let bal = parseInt(localStorage.getItem(v+'bal_'+uid)) || 0;
        let dia = parseInt(localStorage.getItem(v+'dia_'+uid)) || 0;
        let salt = parseInt(localStorage.getItem(v+'salt_'+uid)) || 1;
        let adThreshold = parseInt(localStorage.getItem(v+'adT_'+uid)) || 0;
        let premExpiry = parseInt(localStorage.getItem(v+'premE_'+uid)) || 0;
        let boosts = parseInt(localStorage.getItem(v+'bstC_'+uid)) || 2;
        let lastBoostDay = localStorage.getItem(v+'bstD_'+uid) || "";
        let hasBot = localStorage.getItem(v+'bot_'+uid) === 'true';
        let botExp = parseInt(localStorage.getItem(v+'botEx_'+uid)) || 0;
        let txs = JSON.parse(localStorage.getItem(v+'txs_'+uid)) || [];
        let eng = 1000;
        let isBoosted = false;

        function initApp() {
            const today = new Date().toDateString();
            if (lastBoostDay !== today) { boosts = 2; localStorage.setItem(v+'bstC_'+uid, 2); localStorage.setItem(v+'bstD_'+uid, today); }
            document.getElementById('dm-id').innerText = uid;
            updateUI(); if (hasBot) startBot(); setInterval(checkPremiumExpiry, 1000);
        }

        function handleTap(e) {
            e.preventDefault();
            if (eng <= 0) return;
            
            const coin = document.getElementById('coin');
            const rect = coin.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width/2;
            const y = e.clientY - rect.top - rect.height/2;
            
            // NO SHRINK: Scale stays 1, only rotation changes
            coin.style.transform = `rotateX(${-y/7}deg) rotateY(${x/7}deg) scale(1)`;

            let val = (premExpiry > Date.now() ? 20 : 1) * (isBoosted ? 5 : 1);
            bal += val; adThreshold += val; eng--;
            
            localStorage.setItem(v+'bal_'+uid, bal);
            localStorage.setItem(v+'adT_'+uid, adThreshold);

            if (adThreshold >= 5000) { 
                adThreshold = 0; localStorage.setItem(v+'adT_'+uid, 0);
                window.Adsgram.init({ blockId: "22672" }).show().then(() => { bal += 500; updateUI(); }); 
            }

            const valEl = document.createElement('div');
            valEl.className = 'tap-val'; valEl.innerText = `+${val}`;
            valEl.style.left = e.clientX + 'px'; valEl.style.top = e.clientY + 'px';
            document.body.appendChild(valEl);
            setTimeout(() => valEl.remove(), 700);
            updateUI();
        }

        function resetTilt() { document.getElementById('coin').style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`; }

        function showDoubleAd() {
            window.Adsgram.init({ blockId: "22672" }).show().then(() => {
                let w = 7; document.getElementById('ad-countdown').style.display = 'block';
                const t = setInterval(() => {
                    w--; document.getElementById('ad-timer-val').innerText = w;
                    if (w <= 0) { 
                        clearInterval(t); 
                        document.getElementById('ad-countdown').style.display = 'none'; 
                        window.Adsgram.init({ blockId: "22672" }).show().then(() => { bal += 3000; updateUI(); }); 
                    }
                }, 1000);
            });
        }

        async function showMonetag() {
            if (typeof show_10611291 === 'function') {
                const res = await show_10611291({ telegram_id: uid });
                if (res && res.reward_event_type === 'valued') { bal += 3000; updateUI(); }
            }
        }

        function activateBoost() {
            if (boosts > 0 && !isBoosted) {
                boosts--; isBoosted = true;
                localStorage.setItem(v+'bstC_'+uid, boosts);
                document.body.classList.add('boost-active');
                let left = 30;
                const bt = setInterval(() => {
                    left--; document.getElementById('boost-timer').innerText = `WARP: ${left}s`;
                    if(left <= 0) { 
                        clearInterval(bt); 
                        isBoosted = false; 
                        document.body.classList.remove('boost-active'); 
                        document.getElementById('boost-timer').innerText = ""; 
                        updateUI(); 
                    }
                }, 1000);
                updateUI();
            }
        }

        function buyBot() {
            hasBot = true; botExp = Date.now() + (12 * 60 * 60 * 1000);
            localStorage.setItem(v+'bot_'+uid, true);
            localStorage.setItem(v+'botEx_'+uid, botExp);
            startBot(); updateUI();
        }

        function startBot() { setInterval(() => { if (botExp > Date.now()) { bal += (premExpiry > Date.now() ? 5 : 1); updateUI(); } }, 3000); }

        function activatePremium() {
            const p1 = (parseInt(suffix) + 777).toString(16);
            const p2 = (parseInt(salt) * 157).toString(16);
            if (document.getElementById('code-input').value.trim() === `DVS-${p1}-${p2}-${suffix}`) {
                premExpiry = Date.now() + (3 * 24 * 60 * 60 * 1000); salt++;
                localStorage.setItem(v+'premE_'+uid, premExpiry);
                localStorage.setItem(v+'salt_'+uid, salt);
                txs.unshift({ date: new Date().toLocaleDateString(), status: "PREMIUM ACTIVATED" });
                localStorage.setItem(v+'txs_'+uid, JSON.stringify(txs));
                updateUI(); tg.showAlert("Premium Activated!");
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = bal.toLocaleString();
            document.getElementById('diamonds').innerText = dia;
            document.getElementById('energy').innerText = eng;
            document.getElementById('boost-count').innerText = boosts;
            document.getElementById('tx-history').innerHTML = txs.map(t => `<div>[${t.date}] ${t.status}</div>`).join('') || "No history.";
            const bBtn = document.getElementById('bot-purchase-btn');
            if (hasBot && botExp > Date.now()) { bBtn.innerText = "ACTIVE"; bBtn.className = "btn-gold btn-active-grey"; }
        }

        function checkPremiumExpiry() {
            const t = document.getElementById('prem-timer');
            if(premExpiry > Date.now()) {
                const diff = premExpiry - Date.now();
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                t.innerText = `PREMIUM: ${d}d ${h}h LEFT`;
            } else t.innerText = "";
        }

        function shareInvite() { tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/crypt7tapbot?startapp=${uid}&text=Join and earn!`); }
        function contactAdmin() { tg.openTelegramLink(`https://t.me/crypt7tapbot?text=ID:${uid}%20requested%20premium`); }
        function doTask(r) { window.open("https://tiktok.com/@ogprincedavis5081"); setTimeout(() => { bal += r; updateUI(); }, 5000); }
        function showTab(id, el) { document.querySelectorAll('.container').forEach(c => c.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
        
        let adminTaps = 0;
        function handleAdminTap() { adminTaps++; if (adminTaps === 3) { if (prompt("Pass:") === "DavisAdmin2026") document.getElementById('admin-box').style.display = 'block'; adminTaps = 0; } setTimeout(() => adminTaps = 0, 2000); }
        function generateAdminCode() {
            const sfx = document.getElementById('adm-suffix').value;
            const slt = document.getElementById('adm-salt').value;
            const p1 = (parseInt(sfx) + 777).toString(16);
            const p2 = (parseInt(slt) * 157).toString(16);
            document.getElementById('gen-result').innerText = `DVS-${p1}-${p2}-${sfx}`;
        }
    </script>
</body>
</html>
