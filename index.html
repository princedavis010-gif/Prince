<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v63.3</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        
        body.boost-active { background: radial-gradient(circle, #1a0033 0%, #010205 100%); animation: lightning-flash 2s infinite; }
        @keyframes lightning-flash { 0%, 100% { box-shadow: inset 0 0 50px rgba(160, 32, 240, 0); } 50% { box-shadow: inset 0 0 100px rgba(160, 32, 240, 0.2); } }

        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.4s ease; }
        
        .coin-wrapper { perspective: 1000px; margin: 35px 0; z-index: 5; }
        .coin-btn { width: 320px; height: 320px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.08s ease-out; transform-style: preserve-3d; cursor: pointer; background-image: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg'); background-size: cover; background-position: center; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        
        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 16px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-cooldown { background: #444 !important; color: #888 !important; border: 1px solid #555 !important; cursor: not-allowed !important; filter: grayscale(1); opacity: 0.7; }

        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }

        .tap-val { position: absolute; color: var(--gold); font-size: 35px; font-weight: 900; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 1000; text-shadow: 0 0 10px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }
        
        #ad-countdown { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 50px; z-index: 10001; font-weight: bold; color: var(--gold); }
        #bot-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: #111; border: 2px solid var(--gold); border-radius: 20px; z-index: 10000; padding: 25px; text-align: center; }
        .glass-card { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; width: 100%; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .bal-container { display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 900; color: var(--gold); }
        .bal-coin { width: 45px; height: 45px; margin-right: 10px; border-radius: 50%; background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover; }
    </style>
</head>

<body onload="initApp();">
    <div id="ad-countdown">NEXT AD IN: <span id="ad-timer-val">7</span>s</div>
    <div id="bot-modal">
        <h2 style="color:var(--gold); margin:0;">🤖 WHILE YOU WERE AWAY</h2>
        <p id="bot-earned-msg" style="font-size:18px; margin:15px 0;"></p>
        <button class="btn-gold" onclick="closeBotModal()">CLAIM</button>
    </div>

    <div id="home" class="container active">
        <div class="bal-container">
            <div id="bal-icon" class="bal-coin"></div>
            <span id="balance">0</span>
        </div>
        <div style="font-size: 20px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        <div id="prem-timer" style="color:var(--green); font-weight:bold; font-size:12px; height:15px;"></div>
        
        <div class="coin-wrapper">
            <div class="coin-btn" id="coin" onpointerdown="handleTap(event)"></div>
        </div>
        <div id="boost-timer" style="color:var(--purple); font-weight:bold; height:20px;"></div>
        <div style="color:#777; font-size:12px;">⚡ <span id="energy">1000</span> / 1000</div>

        <div style="width:100%; margin-top:20px;">
            <button class="btn-gold" style="background: var(--dia); color:#000;" onclick="showDoubleAd()">📺 GET FREE 3,000 COINS</button>
            <button id="monetag-btn" class="btn-gold" style="background: #222; border: 1px solid var(--gold); color:var(--gold);" onclick="showMonetag()">📺 GET FREE 3,000 COINS</button>
        </div>
    </div>

    <div id="tasks" class="container">
        <h2 style="color:var(--gold);">TASKS</h2>
        <div class="glass-card">
            <h3 style="color:var(--purple); margin:0;">👥 INVITE FRIENDS</h3>
            <p>Get 10,000 for joins!</p>
            <button class="btn-gold" style="background:var(--purple); color:white;" onclick="shareInvite()">INVITE</button>
        </div>
        <div class="glass-card"><p>Follow TikTok @ogprincedavis5081</p><button class="btn-gold" style="background:#ff0050; color:white;" onclick="doTask('tiktok', 5000)">LIKE/COMMENT (+5,000)</button></div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🏠 HOME</div>
        <div class="nav-item" onclick="showTab('tasks', this)">📋 TASKS</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const v = "v3_";
        const secretKey = 777;

        let bal = parseInt(localStorage.getItem(v + 'bal_' + uid)) || 0;
        let dia = parseInt(localStorage.getItem(v + 'dia_' + uid)) || 0;
        let salt = parseInt(localStorage.getItem(v + 'salt_' + uid)) || 1;
        let eng = localStorage.getItem(v + 'eng_' + uid) !== null ? parseInt(localStorage.getItem(v + 'eng_' + uid)) : 1000;
        let premExpiry = parseInt(localStorage.getItem(v + 'premExp_' + uid)) || 0;
        let hasBot = localStorage.getItem(v + 'bot_' + uid) === 'true';
        let botExpiry = parseInt(localStorage.getItem(v + 'botExp_' + uid)) || 0;
        let isBoosted = false;

        const AdController = window.Adsgram.init({ blockId: "22672" });

        function initApp() { 
            checkAwayEarnings(); updateUI(); checkMonetagCooldown();
            if (hasBot) startBot();
            setInterval(checkPremiumExpiry, 1000);
            setInterval(() => { if(eng < 1000) { eng++; updateUI(); } }, 2000);
        }

        function showTab(id, el) { document.querySelectorAll('.container').forEach(c => c.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active'); }

        function handleTap(e) {
            e.preventDefault();
            const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
            touches.forEach(t => {
                if (eng > 0) {
                    let val = (premExpiry > Date.now() ? 20 : 1) * (isBoosted ? 5 : 1);
                    bal += val; eng--;
                    const valEl = document.createElement('div');
                    valEl.className = 'tap-val'; valEl.innerText = `+${val}`;
                    valEl.style.left = t.clientX + 'px'; valEl.style.top = t.clientY + 'px';
                    document.body.appendChild(valEl);
                    setTimeout(() => valEl.remove(), 800);
                }
            });
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance').innerText = bal.toLocaleString();
            document.getElementById('diamonds').innerText = dia;
            document.getElementById('energy').innerText = eng;
            localStorage.setItem(v + 'bal_' + uid, bal);
            localStorage.setItem(v + 'dia_' + uid, dia);
            localStorage.setItem(v + 'eng_' + uid, eng);
        }

        async function showMonetag() {
            const btn = document.getElementById('monetag-btn');
            const cooldownEnd = localStorage.getItem(v + 'monetag_expiry_' + uid) || 0;
            if (Date.now() < cooldownEnd) {
                const rem = Math.ceil((cooldownEnd - Date.now()) / 1000);
                tg.showAlert(`Cooldown; ${rem} seconds remaining`); return;
            }
            if (typeof show_10611291 === 'function') {
                try {
                    await show_10611291({ telegram_id: uid });
                    bal += 3000; updateUI(); tg.showAlert("✅ +3,000 Coins Added!");
                    localStorage.setItem(v + 'monetag_expiry_' + uid, Date.now() + 90000);
                    startMonetagTimer(btn, 90);
                } catch (e) { tg.showAlert("Ad failed."); }
            }
        }

        function checkMonetagCooldown() {
            const btn = document.getElementById('monetag-btn');
            const end = localStorage.getItem(v + 'monetag_expiry_' + uid) || 0;
            if (Date.now() < end) startMonetagTimer(btn, Math.ceil((end - Date.now()) / 1000));
        }

        function startMonetagTimer(btn, sec) {
            btn.classList.add('btn-cooldown');
            const t = setInterval(() => {
                let rem = Math.ceil((localStorage.getItem(v + 'monetag_expiry_' + uid) - Date.now()) / 1000);
                if (rem <= 0) { clearInterval(t); btn.classList.remove('btn-cooldown'); btn.innerText = "📺 GET FREE 3,000 COINS"; }
                else btn.innerText = `COOLDOWN (${rem}S)`;
            }, 1000);
        }

        function showDoubleAd() { AdController.show().then(() => { let w=7; document.getElementById('ad-countdown').style.display='block'; const t=setInterval(() => { w--; document.getElementById('ad-timer-val').innerText=w; if(w<=0){clearInterval(t); document.getElementById('ad-countdown').style.display='none'; AdController.show().then(()=> {bal+=3000; updateUI();}); } }, 1000); }); }
        function shareInvite() { const url = `https://t.me/share/url?url=https://t.me/crypt7tapbot/prince?startapp=${uid}`; tg.openTelegramLink(url); }
        function checkPremiumExpiry() { if(premExpiry > Date.now()) document.getElementById('prem-timer').innerText = "Elite Status: Active"; }
        function startBot() { if(hasBot) setInterval(() => { if(botExpiry > Date.now()) { bal += 1; updateUI(); } }, 3000); }
        function checkAwayEarnings() { /* Original logic */ }
        function closeBotModal() { document.getElementById('bot-modal').style.display = 'none'; }
    </script>
</body>
</html>
