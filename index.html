<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v64.0</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='https://libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        
        .coin-wrapper { perspective: 1000px; margin: 35px 0; z-index: 5; }
        .coin-btn { width: 320px; height: 320px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.08s ease-out; transform-style: preserve-3d; cursor: pointer; background-image: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg'); background-size: cover; background-position: center; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .coin-btn::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; transform: translateZ(-18px); background: #2c2105; }
        
        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.4s ease; }
        
        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 16px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-active-grey { background: #555 !important; color: #888 !important; cursor: not-allowed !important; filter: grayscale(1); opacity: 0.7; }
        
        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }

        .tap-val { position: absolute; color: var(--gold); font-size: 35px; font-weight: 900; animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 1000; text-shadow: 0 0 10px #000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-160px); } }
        
        #ad-countdown { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 50px; z-index: 10001; font-weight: bold; color: var(--gold); }
        .glass-card { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; width: 100%; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .bal-container { display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 900; color: var(--gold); }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); width: 80%; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--dia), #fff); width: 0%; transition: width 0.3s; }
    </style>
</head>

<body onload="initApp();">
    <div id="ad-countdown">NEXT AD IN: <span id="ad-timer-val">7</span>s</div>

    <div id="home" class="container active">
        <div class="bal-container">
            <div style="width:45px; height:45px; margin-right:10px; border-radius:50%; background:url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover;"></div>
            <span id="balance">0</span>
        </div>
        <div class="progress-bar"><div id="dia-progress" class="progress-fill"></div></div>
        <div style="font-size: 20px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        
        <div class="coin-wrapper">
            <div class="coin-btn" id="coin" onpointerdown="handleTap(event)"></div>
        </div>
        <div style="color:#777; font-size:12px;">⚡ <span id="energy">1000</span> / 1000</div>

        <button class="btn-gold" style="background: var(--dia); color:#000;" onclick="showDoubleAd()">📺 ADSGRAM: 3,000 COINS</button>
        <button id="monetag-btn" class="btn-gold" style="background: #222; border: 1px solid var(--gold); color:var(--gold);" onclick="showMonetag()">📺 MONETAG: 3,000 COINS</button>
    </div>

    <div id="tasks" class="container">
        <h2 style="color:var(--gold);">TASKS</h2>
        <div class="glass-card" style="border: 1px solid var(--purple);">
            <h3 style="color:var(--purple); margin:0;">👥 INVITE FRIENDS</h3>
            <button class="btn-gold" style="background:var(--purple); color:white;" onclick="shareInvite()">INVITE</button>
        </div>
        <div class="glass-card">
            <p>Follow TikTok @ogprincedavis5081</p>
            <button class="btn-gold" style="background:#ff0050; color:white;" onclick="doTask('tiktok', 5000)">FOLLOW (+5,000)</button>
        </div>
    </div>

    <div id="shop" class="container">
        <h2 style="color:var(--gold);">BOOSTERS</h2>
        <div class="glass-card">
            <h3>👆 TAP UPGRADE</h3>
            <p>Lvl: <span id="tap-lvl-display">1</span></p>
            <button id="tap-upgrade-btn" class="btn-gold" onclick="upgradeTap()">UPGRADE (5,000)</button>
        </div>
    </div>

    <div id="premium" class="container">
        <h2 style="color:var(--gold);">PREMIUM SHOP</h2>
        <div class="glass-card">
            <p style="color:var(--gold); font-weight:bold; font-size:24px;">ID: <span id="p-suffix">--</span></p>
            <div id="pay-info">
                <p>Premium Sub (20x Tap) | ₦200</p>
                <p>OPay: <b>8124647818</b></p>
                <input type="text" id="code-input" class="btn-gold" style="background:#111; color:#fff; text-align:center;" placeholder="ENTER CODE">
            </div>
            <p id="prem-timer-elite" style="color:var(--green); font-weight:bold;"></p>
            <button id="activate-btn" class="btn-gold" style="background:var(--green);" onclick="activatePremium()">ACTIVATE PREMIUM</button>
        </div>
        <button class="btn-gold" id="redeem-btn" onclick="requestRedeem()">REDEEM DIAMOND FOR ₦100 AIRTIME</button>
        
        <div class="glass-card" style="margin-top:20px;">
            <h4 id="admin-trigger" onclick="handleAdminTap()" style="cursor:pointer;">📜 RECENT ACTIVITY</h4>
            <div id="tx-history">No recent requests.</div>
            
            <div id="admin-box" style="display:none; margin-top:15px; border-top:1px solid #444; padding-top:10px;">
                <input type="text" id="adm-suffix" class="btn-gold" style="background:#333; color:#fff;" placeholder="Suffix">
                <input type="number" id="adm-salt" class="btn-gold" style="background:#333; color:#fff;" placeholder="Salt">
                <button class="btn-gold" style="background:var(--dia);" onclick="generateAdminCode()">GENERATE</button>
                <div id="gen-result" style="color:var(--green); margin:10px 0; font-weight:bold;"></div>
                
                <input type="text" id="adm-uid" class="btn-gold" style="background:#333; color:#fff;" placeholder="User ID">
                <input type="text" id="adm-msg" class="btn-gold" style="background:#333; color:#fff;" placeholder="Message">
                <button class="btn-gold" onclick="sendAdminNotice()">SEND</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🪙<br>Home</div>
        <div class="nav-item" onclick="showTab('tasks', this)">📋<br>Tasks</div>
        <div class="nav-item" onclick="showTab('shop', this)">⚡<br>Boost</div>
        <div class="nav-item" onclick="showTab('premium', this)">⭐<br>Elite</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const suffix = uid.slice(-4);
        const botToken = "8494916372:AAHnNbLt8lykAKqUuGLIZnY0BBoC6UB0qbI";
        const chatId = "-1003843441800";
        const v = "v3_";
        const secretKey = 777;

        let bal = parseFloat(localStorage.getItem(v + 'bal_' + uid)) || 0;
        let dia = parseInt(localStorage.getItem(v + 'dia_' + uid)) || 0;
        let tapLvl = parseInt(localStorage.getItem(v + 'tapLvl_' + uid)) || 1;
        let salt = parseInt(localStorage.getItem(v + 'salt_' + uid)) || 1;
        let premExpiry = parseInt(localStorage.getItem(v + 'premExp_' + uid)) || 0;
        let eng = localStorage.getItem(v + 'eng_' + uid) !== null ? parseInt(localStorage.getItem(v + 'eng_' + uid)) : 1000;
        const AdController = window.Adsgram.init({ blockId: "22672" });

        function handleTap(e) {
            e.preventDefault();
            const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
            touches.forEach(t => {
                if (eng > 0) {
                    let val = (premExpiry > Date.now()) ? 20 : tapLvl;
                    bal += val; eng--;
                    showAnimations(t.clientX, t.clientY, val);
                }
            });
            updateUI();
        }

        function updateUI() {
            if (bal >= 50000) { bal -= 50000; dia++; confetti(); }
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('diamonds').innerText = dia;
            document.getElementById('energy').innerText = eng;
            document.getElementById('p-suffix').innerText = suffix;
            document.getElementById('tap-lvl-display').innerText = tapLvl;
            document.getElementById('dia-progress').style.width = (bal / 50000 * 100) + '%';
            
            const actBtn = document.getElementById('activate-btn');
            const rBtn = document.getElementById('redeem-btn');
            
            if (premExpiry > Date.now()) {
                let d = Math.floor((premExpiry - Date.now())/86400000);
                document.getElementById('prem-timer-elite').innerText = `ELITE ACTIVE: ${d} DAYS LEFT`;
                document.getElementById('pay-info').style.display = 'none';
                actBtn.innerText = "✅ACTIVE"; actBtn.classList.add('btn-active-grey');
            }
            if (dia < 1) rBtn.classList.add('btn-active-grey'); else rBtn.classList.remove('btn-active-grey');

            localStorage.setItem(v + 'bal_' + uid, bal);
            localStorage.setItem(v + 'dia_' + uid, dia);
            localStorage.setItem(v + 'eng_' + uid, eng);
        }

        async function requestRedeem() {
            if (dia < 1) { tg.showAlert("Need at least 1 Diamond!"); return; }
            let ph = prompt("Enter phone number for ₦100 Airtime:");
            if (ph) {
                const m = `🚨 REDEEM\n🆔 Suffix: ${suffix}\n📞 Phone: ${ph}\n👤 User: ${uid}`;
                const r = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chatId, text: m }) });
                if (r.ok) { dia--; updateUI(); tg.showAlert("Sent!"); }
            }
        }

        function showDoubleAd() { 
            AdController.show().then(() => { 
                let w=7; 
                document.getElementById('ad-countdown').style.display='block'; 
                const t=setInterval(() => { 
                    w--; document.getElementById('ad-timer-val').innerText=w; 
                    if(w<=0){ 
                        clearInterval(t); document.getElementById('ad-countdown').style.display='none'; 
                        AdController.show().then(()=> { bal+=3000; updateUI(); }); 
                    } 
                }, 1000); 
            }).catch(() => tg.showAlert("Ad failed to load."));
        }

        async function showMonetag() {
            if (typeof show_10611291 === 'function') {
                const res = await show_10611291({ telegram_id: uid });
                if (res?.reward_event_type === 'valued') { bal += 3000; updateUI(); }
            }
        }

        function activatePremium() { 
            const input = document.getElementById('code-input').value;
            const correct = `DVS-${(parseInt(suffix)+secretKey).toString(16)}-${(parseInt(salt)*157).toString(16)}-${suffix}`;
            if(input === correct) { 
                premExpiry = Date.now() + (3*86400000); salt++; 
                localStorage.setItem(v+'salt_'+uid, salt); localStorage.setItem(v+'premExp_'+uid, premExpiry);
                updateUI(); 
                tg.showAlert("Premium has successfully been Activated. Good job!"); 
            } else { tg.showAlert("INCORRECT KEY! ❌🔑"); }
        }

        function shareInvite() { window.open(`https://t.me/share/url?url=https://t.me/crypt7tapbot/prince?start=${uid}&text=Join me on Crypto Tap! Get rewards!`); }
        function doTask(t, r) { window.open("https://www.tiktok.com/@ogprincedavis5081"); setTimeout(() => { bal += r; updateUI(); tg.showAlert("Reward Claimed!"); }, 5000); }
        function upgradeTap() { if(bal >= 5000){ bal -= 5000; tapLvl++; updateUI(); tg.showAlert("Upgraded!"); } else tg.showAlert("Need 5,000 Coins!"); }
        
        function showAnimations(x, y, val) {
            const valEl = document.createElement('div');
            valEl.className = 'tap-val'; valEl.innerText = `+${val}`;
            valEl.style.left = x + 'px'; valEl.style.top = y + 'px';
            document.body.appendChild(valEl);
            setTimeout(() => valEl.remove(), 800);
            const rect = document.getElementById('coin').getBoundingClientRect();
            const rY = ((x - (rect.left + rect.width / 2)) / (rect.width / 2)) * 20;
            const rX = -((y - (rect.top + rect.height / 2)) / (rect.height / 2)) * 20;
            document.getElementById('coin').style.transform = `rotateY(${rY}deg) rotateX(${rX}deg)`;
            setTimeout(() => document.getElementById('coin').style.transform = "rotateY(0deg) rotateX(0deg)", 80);
        }

        function handleAdminTap() { if (++this.taps === 3) { if (prompt("Pass:") === "DavisAdmin2026") document.getElementById('admin-box').style.display = 'block'; this.taps = 0; } setTimeout(() => this.taps = 0, 2000); }
        function generateAdminCode() { 
            const s = document.getElementById('adm-suffix').value;
            const sl = document.getElementById('adm-salt').value;
            document.getElementById('gen-result').innerText = `DVS-${(parseInt(s)+secretKey).toString(16)}-${(parseInt(sl)*157).toString(16)}-${s}`;
        }
        function sendAdminNotice() { tg.showAlert("Notice Sent!"); }
        function showTab(id, el) { document.querySelectorAll('.container').forEach(c => c.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.getElementById(id).classList.add('active'); el.classList.add('active'); }
        function initApp() { updateUI(); setInterval(() => { if (eng < 1000) eng++; updateUI(); }, 1000); }
    </script>
</body>
</html>
