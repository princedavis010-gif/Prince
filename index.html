<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto_Tap v69.0</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='10611291' data-sdk='show_10611291'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --gold: #f3ba2f; --green: #00ff88; --dia: #00d2ff; --purple: #a020f0; --bg: #010205; }
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; color: white; background: var(--bg); transition: 0.8s; }
        
        .container { flex: 1; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; padding-bottom: 120px; width: 100%; }
        .container.active { display: flex; animation: fadeIn 0.4s ease; }
        .glass-card { background: rgba(255,255,255,0.06); border-radius: 18px; padding: 15px; width: 100%; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        
        /* Buttons */
        .btn-gold { background: linear-gradient(135deg, var(--gold), #bf9524); color: #221a04; padding: 14px; border-radius: 15px; font-weight: 800; border: none; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-active-grey { background: #444 !important; color: #888 !important; cursor: not-allowed !important; filter: grayscale(1); opacity: 0.7; }
        
        .upgrade-content { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
        .price-line { display: flex; align-items: center; font-size: 14px; margin-top: 4px; opacity: 0.9; }
        .mini-coin { width: 18px; height: 18px; border-radius: 50%; background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover; margin-right: 5px; }

        /* UI Elements */
        .bal-container { display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: 900; color: var(--gold); }
        .bal-coin { width: 45px; height: 45px; margin-right: 10px; border-radius: 50%; background: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg') center/cover; }
        .coin-btn { width: 320px; height: 320px; border-radius: 50%; background-image: url('https://raw.githubusercontent.com/princedavis010-gif/Prince/refs/heads/main/IMG-20260212-WA0024.jpg'); background-size: cover; background-position: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); transition: transform 0.08s; margin: 20px 0; }
        
        .nav { height: 85px; background: #000; display: flex; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding-top: 20px; color: #666; font-size: 10px; font-weight: bold; }
        .nav-item.active { color: var(--gold); }

        #bot-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; background: #111; border: 2px solid var(--gold); border-radius: 20px; z-index: 10000; padding: 25px; text-align: center; }
    </style>
</head>

<body onload="initApp();">
    <div id="bot-modal">
        <h2 style="color:var(--gold); margin:0;">🤖 WHILE YOU WERE AWAY</h2>
        <p id="bot-earned-msg" style="font-size:18px; margin:15px 0;"></p>
        <button class="btn-gold" onclick="closeBotModal()">CLAIM EARNINGS</button>
    </div>

    <div id="home" class="container active">
        <div class="bal-container">
            <div class="bal-coin"></div>
            <span id="balance">0</span>
        </div>
        <div style="font-size: 20px; color: var(--dia); font-weight: bold;">💎 <span id="diamonds">0</span></div>
        <div class="coin-btn" id="coin" onpointerdown="handleTap(event)"></div>
        <div style="color:#777; font-size:14px;">⚡ <span id="energy">1000</span> / 1000</div>
    </div>

    <div id="shop" class="container">
        <h2 style="color:var(--gold);">BOOSTERS</h2>
        
        <div class="glass-card">
            <h3>UPGRADE TAP</h3>
            <p>Current: +<span id="tap-lvl-display">1</span> / Tap</p>
            <button class="btn-gold" onclick="upgradeTap()">
                <div class="upgrade-content">
                    <span>UPGRADE</span>
                    <div class="price-line">
                        <div class="mini-coin"></div>
                        <span id="upgrade-cost-text">5,000</span>
                    </div>
                </div>
            </button>
        </div>

        <div class="glass-card">
            <h3>AUTO-TAP BOT</h3>
            <p id="bot-status">Status: Ready</p>
            <button id="bot-btn" class="btn-gold" onclick="activateBot()">ACTIVATE</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('home', this)">🪙<br>Home</div>
        <div class="nav-item" onclick="showTab('shop', this)">⚡<br>Boost</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const uid = tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "0000";
        const v = "v69_"; 
        
        // Configuration: 40,000 coins per 24 hours
        const COINS_PER_24H = 40000;
        const SEC_IN_24H = 86400;
        const BOT_RATE = COINS_PER_24H / SEC_IN_24H; // ~0.46296 coins per sec

        let bal = parseFloat(localStorage.getItem(v + 'bal')) || 0;
        let tapLvl = parseInt(localStorage.getItem(v + 'tapLvl')) || 1;
        let botExpiry = parseInt(localStorage.getItem(v + 'botExp')) || 0;
        let eng = parseInt(localStorage.getItem(v + 'eng')) || 1000;
        let lastVisit = parseInt(localStorage.getItem(v + 'lastVisit')) || Date.now();
        let botBuffer = 0;

        function getUpgradeCost(lvl) {
            const costs = [5000, 7500, 10000, 15000];
            return lvl <= 4 ? costs[lvl-1] : 15000 + ((lvl-4)*5000);
        }

        function initApp() {
            const now = Date.now();
            const elapsed = Math.floor((now - lastVisit) / 1000);

            // 1. Background Energy Refill (1 per 2 seconds)
            eng = Math.min(1000, eng + Math.floor(elapsed / 2));

            // 2. Background Bot Earnings
            if (lastVisit < botExpiry) {
                let activeTime = Math.min(now, botExpiry) - lastVisit;
                let activeSecs = Math.floor(activeTime / 1000);
                if (activeSecs > 10) {
                    let earned = Math.floor(activeSecs * BOT_RATE);
                    bal += earned;
                    document.getElementById('bot-earned-msg').innerText = `Your bot generated ${earned.toLocaleString()} coins while you were away!`;
                    document.getElementById('bot-modal').style.display = 'block';
                    confetti();
                }
            }

            updateUI();
            
            // Loop runs every second
            setInterval(() => {
                const currentTime = Date.now();
                
                // Energy refill check (every 2nd tick)
                if (currentTime % 2000 < 1000 && eng < 1000) eng++;

                // Bot generation
                if (currentTime < botExpiry) {
                    botBuffer += BOT_RATE;
                    if (botBuffer >= 1) {
                        let whole = Math.floor(botBuffer);
                        bal += whole;
                        botBuffer -= whole;
                    }
                }

                localStorage.setItem(v + 'lastVisit', currentTime);
                updateUI();
            }, 1000);
        }

        function activateBot() {
            if (Date.now() > botExpiry) {
                botExpiry = Date.now() + (12 * 3600 * 1000);
                localStorage.setItem(v + 'botExp', botExpiry);
                tg.showAlert("You have successfully activated your auto farm bot. Good job!");
                updateUI();
            }
        }

        function upgradeTap() {
            let cost = getUpgradeCost(tapLvl);
            if (bal >= cost) {
                bal -= cost;
                tapLvl++;
                localStorage.setItem(v + 'tapLvl', tapLvl);
                updateUI();
                tg.showAlert("Tap Value Upgraded!");
            } else {
                tg.showAlert("Not enough coins!");
            }
        }

        function handleTap(e) {
            if (eng > 0) {
                bal += tapLvl;
                eng--;
                updateUI();
                document.getElementById('coin').style.transform = "scale(0.95)";
                setTimeout(() => document.getElementById('coin').style.transform = "scale(1)", 50);
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            document.getElementById('energy').innerText = eng;
            document.getElementById('tap-lvl-display').innerText = tapLvl;
            document.getElementById('upgrade-cost-text').innerText = getUpgradeCost(tapLvl).toLocaleString();
            
            const botBtn = document.getElementById('bot-btn');
            const botStatus = document.getElementById('bot-status');
            
            if (Date.now() < botExpiry) {
                botBtn.innerText = "ACTIVE";
                botBtn.classList.add('btn-active-grey');
                botStatus.innerText = "Status: Farming...";
            } else {
                botBtn.innerText = "ACTIVATE";
                botBtn.classList.remove('btn-active-grey');
                botStatus.innerText = "Status: Ready";
            }

            localStorage.setItem(v + 'bal', bal);
            localStorage.setItem(v + 'eng', eng);
        }

        function showTab(id, el) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function closeBotModal() { document.getElementById('bot-modal').style.display = 'none'; }
    </script>
</body>
</html>
